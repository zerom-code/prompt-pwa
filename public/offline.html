<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfafc"><title>Forma — без сети</title><style>body{background:#fbfafc;color:#685374;font:15px Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center}main{padding:30px;max-width:460px;text-align:center}img{width:64px;border-radius:16px}h1{font-size:27px;font-weight:500}p{color:#a18caf;line-height:1.8}a{display:inline-block;background:#8664cc;color:white;padding:13px 22px;border-radius:8px;text-decoration:none;margin:15px}article{text-align:left;border:1px solid #e8dcee;background:white;padding:17px;border-radius:9px;margin:14px 0}h2{font-size:14px}pre{font:12px/1.8 Arial;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><img src="./icon.svg" alt="Forma"><h1>Идеи не исчезают без сети.</h1><p>Конструктор и сохранённая история доступны на этом устройстве.</p><a href="./">Вернуться в Forma</a><section id="history"></section><script>try{const rows=JSON.parse(localStorage.getItem('forma_history')||'[]');for(const row of rows){const article=document.createElement('article');const h=document.createElement('h2');h.textContent=row.title;const pre=document.createElement('pre');pre.textContent=row.output;article.append(h,pre);document.getElementById('history').append(article)}}catch{}</script></main></body></html>
